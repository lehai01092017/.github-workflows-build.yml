      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ConfTranslator
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ConfTranslator/app/build/outputs/apk/debug/app-debug.apk

      - name: Dang APK len Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ConfTranslator/app/build/outputs/apk/debug/app-debug.apk DichHoiThao.apk
          gh release create "apk-${{ github.run_number }}" DichHoiThao.apk \
            --repo "${{ github.repository }}" \
            --title "Dich Hoi Thao #${{ github.run_number }}" \
            --notes "Tai DichHoiThao.apk ve dien thoai va cai dat."
